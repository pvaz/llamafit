[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "llamafit"
version = "0.1.0a1"
description = "Find, size, install and verify open-weight LLMs for llama.cpp on your own machine."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Paulo Vaz" }]
keywords = ["llama.cpp", "gguf", "llm", "local-ai", "hardware", "benchmark"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "typer>=0.12",
  "rich>=13.7",
  "pydantic>=2.7",
  "platformdirs>=4.2",
  "psutil>=5.9",
  "py-cpuinfo>=9.0",
  "httpx>=0.27",
]

[project.optional-dependencies]
fast = ["numpy>=1.26"]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "mypy>=1.10",
  "numpy>=1.26", # so the suite and CI exercise the NumPy bandwidth measurement
  "types-psutil",
  "types-PyYAML",
]

[project.scripts]
llamafit = "llamafit.cli.app:main"

[project.urls]
Homepage = "https://github.com/pvaz/llamafit"
Documentation = "https://github.com/pvaz/llamafit/tree/main/docs"
Issues = "https://github.com/pvaz/llamafit/issues"
Changelog = "https://github.com/pvaz/llamafit/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/llamafit"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "D"]
ignore = ["D203", "D213", "D107", "A003"]
pydocstyle = { convention = "google" }

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.mypy]
python_version = "3.10"
strict = true
mypy_path = "src"
packages = ["llamafit"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["cpuinfo", "cpuinfo.*", "numpy", "numpy.*"]
ignore_missing_imports = true
# Current NumPy stubs are written in 3.12 syntax, which mypy cannot parse while checking
# against our minimum, python_version 3.10; the one call site treats NumPy as untyped anyway.
follow_imports = "skip"
follow_imports_for_stubs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["hardware: needs the real machine, skipped in CI"]

[tool.coverage.run]
source = ["llamafit"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
