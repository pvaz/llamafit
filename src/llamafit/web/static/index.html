  There is no English in this file. Every visible word arrives from GET /api/v1/ui, which
  builds it through the same gettext catalogs the command line reads, so the page speaks
  whatever language LlamaFit was started in. A `data-t` attribute names the string to put
  in an element; app.js fills them in before the page is shown.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <!--
      The page is dark and does not follow the viewer's theme; this says so before the
      stylesheet has loaded, so the browser paints its own furniture to match rather than
      flashing a white band above a dark page.
    -->
    <meta name="theme-color" content="#101317" />
    <title>LlamaFit</title>
    <!--
      The icon is drawn here rather than fetched. A favicon file would be one more request,
      and a favicon from anywhere but this machine would be a request off it. Its two
      colours are the page's ground and the one colour the page spends on a figure.
    -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%23101317'/%3E%3Cpath d='M4 11.5V4.5h1.6v5.6H9V11.5zm6.4 0V4.5H12v7z' fill='%2379c6e3'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="top">
      <div class="title">
        <h1>LlamaFit<span id="sim-badge" class="badge" hidden></span></h1>
        <p id="subtitle" class="muted" data-t="app.subtitle"></p>
      </div>
      <p id="host-line" class="muted"></p>
    </header>

    <p id="estimate-notice" class="notice"></p>
    <p id="catalog-problems" class="notice warn" hidden></p>
    <p id="failure" class="notice error" hidden></p>

    <!--
      The machine is a line, not a page. Everything behind that line -- the probes, the
      llama.cpp installation, and the machine to pretend this is instead -- is one
      disclosure away and folded by default, because a person reading the list is not
      reading it.
    -->
    <div class="drawers">
      <details>
        <summary data-t="panel.host"></summary>
        <div id="host-facts"></div>
        <h3 data-t="host.llamacpp"></h3>
        <div id="host-llamacpp"></div>
        <h3 data-t="host.findings"></h3>
        <div id="host-findings"></div>
        <div class="actions">
          <button type="button" id="rescan" data-t="host.rescan"></button>
        </div>
      </details>
      <details>
        <summary data-t="panel.simulate"></summary>
        <form id="simulate-form">
          <label>
            <span data-t="simulate.profile"></span>
            <select name="profile" id="simulate-profile"></select>
          </label>
          <label>
            <span data-t="simulate.gpu_memory"></span>
            <input type="text" name="memory" />
          </label>
          <label>
            <span data-t="simulate.ram"></span>
            <input type="text" name="ram" />
          </label>
          <label>
            <span data-t="simulate.cpu_cores"></span>
            <input type="number" name="cpu_cores" min="1" />
          </label>
          <small class="muted" data-t="simulate.sizes"></small>
          <div class="actions">
            <button type="submit" data-t="simulate.apply"></button>
            <button type="button" id="simulate-clear" data-t="simulate.clear"></button>
          </div>
        </form>
      </details>
    </div>

    <!--
      The request, always on screen and never behind a tab. Every control re-asks the
      server the moment it changes, so a person watches the list answer them rather than
      filling a form in and pressing a button to find out.
    -->
    <form id="needs-form" class="controls" autocomplete="off">
      <label>
        <span data-t="needs.use_case"></span>
        <select name="use_case" id="needs-use-case"></select>
      </label>
      <label>
        <span data-t="needs.prefer"></span>
        <select name="prefer" id="needs-prefer"></select>
      </label>
      <label>
        <span data-t="needs.min_context"></span>
        <input type="number" name="min_context" min="0" step="1024" value="0" />
      </label>
      <label>
        <span data-t="needs.max_download"></span>
        <input type="text" name="max_download" inputmode="text" />
      </label>
      <label>
        <span data-t="needs.limit"></span>
        <input type="number" name="limit" min="1" max="200" value="50" />
      </label>
      <fieldset>
        <legend data-t="needs.require"></legend>
        <div id="needs-capabilities" class="checks"></div>
      </fieldset>
      <div class="switches">
        <label class="check">
          <input type="checkbox" name="all_quants" />
          <span data-t="needs.all_quants"></span>
        </label>
        <label class="check">
          <input type="checkbox" name="vision" checked />
          <span data-t="needs.vision"></span>
        </label>
        <button type="reset" data-t="needs.reset"></button>
      </div>
    </form>

    <main>
      <h2 data-t="panel.board"></h2>
      <p id="board-empty" class="muted" hidden></p>
      <!--
        What the figures are is said above the list, not under it. Under it was fine for
        three rows and is never read at fifty.
      -->
      <div id="board-captions" class="captions"></div>
      <div id="board-table"></div>
    </main>

    <footer>
      <a id="source-link" href="https://github.com/pvaz/llamafit" data-t="app.source"></a>
      <span class="muted" data-t="app.local_only"></span>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
