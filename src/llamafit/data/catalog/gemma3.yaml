# Sourced from Google's Hugging Face model cards, the Gemma 3 technical report, the Gemma
# Terms of Use and the bartowski GGUF repositories.
# Primary sources used for this file:
#   - Model card: https://huggingface.co/google/gemma-3-27b-it
#   - Technical report: https://arxiv.org/abs/2503.19786
#   - Google's Gemma 3 model card page: https://ai.google.dev/gemma/docs/core/model_card_3
#   - Release dates: https://ai.google.dev/gemma/docs/releases
#   - Licence: https://ai.google.dev/gemma/terms
#   - GGUF repositories: https://huggingface.co/bartowski/google_gemma-3-27b-it-GGUF
#                        https://huggingface.co/bartowski/google_gemma-3-12b-it-GGUF
#                        https://huggingface.co/bartowski/google_gemma-3-4b-it-GGUF
#                        https://huggingface.co/bartowski/google_gemma-3-1b-it-GGUF
#
# The model card's own tables (and the numbers first recorded here) are for the PRETRAINED
# (PT) 27B checkpoint, not this instruction-tuned (IT) one: MMLU 78.6, HumanEval 48.8 and
# DocVQA 85.6 all come from the PT tables. The benchmarks below instead come from the
# technical report's IT-specific tables: MMLU-Pro 67.5 (Table 6, "instruction fine-tuned (IT)
# models ... zero-shot benchmarks"), HumanEval 87.8 (Table 18) and DocVQA 86.6 (Table 16).
# The IT tables carry no plain MMLU row, hence MMLU-Pro instead of MMLU here. Every score on
# the smaller entries added later comes from the same three IT tables, for the same reason.
#
# LICENCE. Gemma 3 is not permissively licensed. The Gemma Terms of Use carry a list of
# prohibited uses that a redistributor must pass on, and anyone distributing the model or a
# derivative of it -- a GGUF conversion included -- has to ship those terms with it. That is
# a different footing from the Apache-2.0 of Gemma 4 in gemma4.yaml, so `spdx` here is the
# vendor's own `gemma` slug rather than a registered SPDX identifier.
#
# SLIDING WINDOW. Every Gemma 3 size interleaves five local sliding-window attention layers
# with one global layer. The window itself is read out of each file's own header by
# `catalog refresh` and is never written here.
#
# RELEASE DATES. Google's release page dates the whole Gemma 3 launch to 10 March 2025,
# which is the date the entries added later carry. The 27B entry's 12 March predates that
# source being consulted and has been left as it was rather than quietly amended.
- id: gemma-3-27b-it
  name: Gemma 3 27B IT
  vendor: Google
  family: gemma3
  release_date: 2025-03-12
  license:
    spdx: gemma
    url: "https://ai.google.dev/gemma/terms"
  params: { total_b: 27, active_b: 27 }
  architecture:
    class: dense
    gguf_arch: gemma3
    notes: "Alternates local and global attention layers (5:1 ratio); a second vision entry alongside qwen3.8-flash-next so the multimodal path is exercised by more than one model."
  context: { native: 131072 }
  capabilities: [vision, multilingual, long-context, tools]
  use_cases: [general, multimodal, chat]
  quality:
    baseline: 74
    benchmarks:
      - name: MMLU-Pro
        score: 67.5
        source: "https://arxiv.org/abs/2503.19786"
      - name: HumanEval
        score: 87.8
        source: "https://arxiv.org/abs/2503.19786"
      - name: DocVQA (val)
        score: 86.6
        source: "https://arxiv.org/abs/2503.19786"
  sources:
    - repo: bartowski/google_gemma-3-27b-it-GGUF
      kind: gguf
      trust: bartowski
      quants:
        - { name: Q4_K_M }
      extras:
        # The entry declares the vision capability but never declared the projector, so
        # nothing charged its bytes to a pool and every plan for this model came out about
        # a gigabyte of card too optimistic for anyone who actually wanted vision. Same
        # omission, and same fix, as the one recorded on qwen3.8-flash-next.
        - { role: mmproj, file: mmproj-google_gemma-3-27b-it-f16.gguf }

# The rest of the Gemma 3 range, smallest last. These are the previous generation now that
# gemma4.yaml exists, and they are kept because they are smaller downloads at every size and
# because the 1B is the only Gemma with no vision tower at all.

- id: gemma-3-12b-it
  name: Gemma 3 12B IT
  vendor: Google
  family: gemma3
  release_date: 2025-03-10
  license:
    spdx: gemma
    url: "https://ai.google.dev/gemma/terms"
  params: { total_b: 12, active_b: 12 }
  architecture:
    class: dense
    gguf_arch: gemma3
    notes: >-
      48 layers alternating five local sliding-window attention layers with one global
      layer, so only eight of them hold a cache that grows with the whole context and the
      other forty stop growing at the window; a 12B model's context is cheaper in memory
      than its layer count suggests. Vision through a separate projector.
  context: { native: 131072 }
  capabilities: [coding, vision, multilingual, long-context, tools]
  use_cases: [general, chat, multimodal, coding]
  quality:
    baseline: 68
    benchmarks:
      - name: MMLU-Pro
        score: 60.6
        source: "https://arxiv.org/abs/2503.19786"
      - name: HumanEval
        score: 85.4
        source: "https://arxiv.org/abs/2503.19786"
      - name: DocVQA (val)
        score: 87.1
        source: "https://arxiv.org/abs/2503.19786"
  sources:
    - repo: bartowski/google_gemma-3-12b-it-GGUF
      kind: gguf
      trust: bartowski
      quants:
        - { name: Q4_K_M }
        - { name: Q6_K }
      extras:
        - { role: mmproj, file: mmproj-google_gemma-3-12b-it-f16.gguf }

- id: gemma-3-4b-it
  name: Gemma 3 4B IT
  vendor: Google
  family: gemma3
  release_date: 2025-03-10
  license:
    spdx: gemma
    url: "https://ai.google.dev/gemma/terms"
  params: { total_b: 4, active_b: 4 }
  architecture:
    class: dense
    gguf_arch: gemma3
    notes: >-
      34 layers on the same five-local-to-one-global pattern, so most of the cache stops
      growing once the sliding window is full and only every sixth layer keeps a full-length
      one. The smallest Gemma 3 that can see: it carries a vision projector, which the 1B
      does not.
  context: { native: 131072 }
  capabilities: [coding, vision, multilingual, long-context, tools]
  use_cases: [general, chat, multimodal]
  quality:
    baseline: 52
    benchmarks:
      - name: MMLU-Pro
        score: 43.6
        source: "https://arxiv.org/abs/2503.19786"
      - name: HumanEval
        score: 71.3
        source: "https://arxiv.org/abs/2503.19786"
      - name: DocVQA (val)
        score: 75.8
        source: "https://arxiv.org/abs/2503.19786"
  sources:
    - repo: bartowski/google_gemma-3-4b-it-GGUF
      kind: gguf
      trust: bartowski
      quants:
        - { name: Q4_K_M }
        - { name: Q8_0 }
      extras:
        - { role: mmproj, file: mmproj-google_gemma-3-4b-it-f16.gguf }

- id: gemma-3-1b-it
  name: Gemma 3 1B IT
  vendor: Google
  family: gemma3
  release_date: 2025-03-10
  license:
    spdx: gemma
    url: "https://ai.google.dev/gemma/terms"
  params: { total_b: 1, active_b: 1 }
  architecture:
    class: dense
    gguf_arch: gemma3
    notes: >-
      26 layers, text only: the one Gemma 3 with no vision tower and no projector to load.
      It keeps the family's five-local-to-one-global attention, and its window is smaller
      than the larger sizes', so the cache is a very small part of an already small model.
      Documented at 32K rather than the 128K of its siblings.
  context: { native: 32768 }
  capabilities: [multilingual]
  # No vision (the technical report's multimodal tables have no 1B row and the GGUF
  # repository publishes no projector), and no coding: LiveCodeBench 1.9 is a claim this
  # model cannot support. Listing either would put it in front of requests it will fail.
  use_cases: [chat, general]
  quality:
    baseline: 36
    benchmarks:
      - name: MMLU-Pro
        score: 14.7
        source: "https://arxiv.org/abs/2503.19786"
      - name: MATH
        score: 48.0
        source: "https://arxiv.org/abs/2503.19786"
      - name: GPQA Diamond
        score: 19.2
        source: "https://arxiv.org/abs/2503.19786"
  sources:
    - repo: bartowski/google_gemma-3-1b-it-GGUF
      kind: gguf
      trust: bartowski
      quants:
        - { name: Q4_K_M }
        - { name: Q8_0 }
