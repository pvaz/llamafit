        score: 66.8
        source: "https://huggingface.co/mistralai/Ministral-3-8B-Instruct-2512"
      - name: MATH (maj@1)
        score: 0.876
        source: "https://huggingface.co/mistralai/Ministral-3-8B-Instruct-2512"
      - name: MM MTBench
        score: 8.08
        source: "https://huggingface.co/mistralai/Ministral-3-8B-Instruct-2512"
  sampling: { temp: 0.1 }
  sources:
    - repo: mistralai/Ministral-3-8B-Instruct-2512-GGUF
      kind: gguf
      trust: official
      quants:
        - { name: Q4_K_M }
        - { name: Q5_K_M }
