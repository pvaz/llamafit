# Mistral AI's edge line: "les Ministraux", the models meant to run on a laptop or a small
# card. Sourced from the vendor's Hugging Face model cards, the release announcements and
# the GGUF repositories, which for the Ministral 3 generation are Mistral's own.
# Primary sources used for this file:
#   - Ministral 3 model cards (one per size; the benchmark tables are identical across them
#     and are quoted from the 14B card):
#     https://huggingface.co/mistralai/Ministral-3-14B-Instruct-2512
#     https://huggingface.co/mistralai/Ministral-3-8B-Instruct-2512
#     https://huggingface.co/mistralai/Ministral-3-3B-Instruct-2512
#     https://huggingface.co/mistralai/Ministral-3-14B-Reasoning-2512
#     https://huggingface.co/mistralai/Ministral-3-8B-Reasoning-2512
#   - Ministral 3 announcement: https://mistral.ai/news/mistral-3
#   - Ministral 3 paper: https://arxiv.org/abs/2601.08584
#   - Official Ministral 3 GGUF repositories, for example:
#     https://huggingface.co/mistralai/Ministral-3-14B-Instruct-2512-GGUF
#   - ministral-8b-instruct-2410 model card:
#     https://huggingface.co/mistralai/Ministral-8B-Instruct-2410
#   - les Ministraux announcement: https://mistral.ai/news/ministraux
#
# THE LICENCE IS NOT THE SAME ACROSS THIS FAMILY. Every Ministral 3 model (the 2512
# generation) is Apache-2.0 and may be used commercially. Ministral 8B Instruct 2410 is
# under the Mistral AI Research License, whose section 3.2 reads "You shall only use the
# Mistral Models, Derivatives (whether or not created by Mistral AI) and Outputs for
# Research Purposes" — research only, commercial use requires a separate licence from
# Mistral. Two models called "Ministral 8B" sit in this file and only one of them may be
# put into a product.
#
# The Ministral 3 benchmark tables are split into Reasoning, Instruct and Base sections.
# Each entry below quotes only its own section: the Instruct entries carry Instruct-table
# numbers and the Reasoning entries carry Reasoning-table numbers. No base-checkpoint score
# appears anywhere in this file.
- id: ministral-3-3b-instruct
  name: Ministral 3 3B Instruct 2512
  vendor: Mistral AI
  family: ministral
  release_date: 2025-12-02
  license:
    spdx: Apache-2.0
    url: "https://www.apache.org/licenses/LICENSE-2.0.txt"
  # The card splits the model into a 3.4B language model and a 0.4B vision encoder. The
  # figure here is the language model alone, because that is what the GGUF quant holds:
  # the vision encoder ships as the separate projector declared under extras.
  params: { total_b: 3.4, active_b: 3.4 }
  architecture:
    class: dense
    gguf_arch: mistral3
    notes: >-
      Dense, with the rope-scaling and scalable-softmax attention shared across the
      Ministral 3 generation. The smallest model in the catalog that still carries a vision
      encoder and a 256k context, which is the whole point of the edge line.
  context: { native: 262144 }
  capabilities: [vision, tools, multilingual, long-context]
  use_cases: [general, chat, multimodal]
  quality:
    baseline: 60
    benchmarks:
      # From the "Instruct" table. Arena Hard and MATH are published as fractions and
      # recorded here exactly as published; WildBench and MM MTBench are not.
      - name: Arena Hard
        score: 0.305
        source: "https://huggingface.co/mistralai/Ministral-3-3B-Instruct-2512"
      - name: WildBench
        score: 56.8
        source: "https://huggingface.co/mistralai/Ministral-3-3B-Instruct-2512"
      - name: MATH (maj@1)
        score: 0.830
        source: "https://huggingface.co/mistralai/Ministral-3-3B-Instruct-2512"
      - name: MM MTBench
        score: 7.83
        source: "https://huggingface.co/mistralai/Ministral-3-3B-Instruct-2512"
  # "Use a temperature below 0.1 for daily-driver and production environments."
  sampling: { temp: 0.1 }
  sources:
    - repo: mistralai/Ministral-3-3B-Instruct-2512-GGUF
      kind: gguf
      trust: official
      # Only two: at 3.4B the whole model is small enough that Q8_0 is an ordinary choice
      # rather than a luxury, and nothing below four bits buys a laptop anything useful.
      quants:
        - { name: Q4_K_M }
        - { name: Q8_0 }
      extras:
        - { role: mmproj, file: Ministral-3-3B-Instruct-2512-BF16-mmproj.gguf }

- id: ministral-3-8b-instruct
  name: Ministral 3 8B Instruct 2512
  vendor: Mistral AI
  family: ministral
  release_date: 2025-12-02
  license:
    spdx: Apache-2.0
    url: "https://www.apache.org/licenses/LICENSE-2.0.txt"
  # 8.4B language model plus a 0.4B vision encoder; the quant holds the former.
  params: { total_b: 8.4, active_b: 8.4 }
  architecture:
    class: dense
    gguf_arch: mistral3
    notes: >-
      Dense. The card puts it in 12 GB of VRAM at FP8 and less once quantised, which at
      four bits makes it the largest of this family that a plain 8 GB card holds outright.
