# Sourced from the vendor's Hugging Face model cards, the Qwen3 technical report and the
# GGUF-publishing repositories.
# Primary sources used for this file:
#   - qwen3-0.6b model card: https://huggingface.co/Qwen/Qwen3-0.6B
#   - qwen3-0.6b GGUF repository: https://huggingface.co/Qwen/Qwen3-0.6B-GGUF
#   - Qwen3 technical report: https://arxiv.org/abs/2505.09388
#   - qwen3.8-flash-next model card: https://huggingface.co/Qwen/Qwen3.8-Flash-Next
#   - qwen3.8-flash-next GGUF repository: https://huggingface.co/unsloth/Qwen3.8-Flash-Next-GGUF
#   - Measured block: docs/calibration/2026-09-09-reference-machine.md (this repository)
- id: qwen3-0.6b
  name: Qwen3-0.6B
  vendor: Alibaba Qwen
  family: qwen3
  release_date: 2025-04-28
  license:
    spdx: Apache-2.0
    url: "https://huggingface.co/Qwen/Qwen3-0.6B/blob/main/LICENSE"
  params: { total_b: 0.6, active_b: 0.6 }
  architecture:
    class: dense
    gguf_arch: qwen3
    notes: >-
      28 layers, 16 query heads, 8 key/value heads (GQA). The smallest dense model in
      the Qwen3 family; kept in the catalog as a fast, low-memory smoke test.
  context: { native: 32768 }
  capabilities: [coding, tools, multilingual]
  use_cases: [general, coding]
  quality:
    baseline: 35
    benchmarks:
      # Table 8 of the technical report reports these for the pretrained Qwen3-0.6B-Base
      # checkpoint, not the released chat model; labelled accordingly.
      - name: MMLU (base model)
        score: 52.81
        source: "https://arxiv.org/abs/2505.09388"
      - name: GSM8K (base model)
        score: 59.59
        source: "https://arxiv.org/abs/2505.09388"
  sampling: { temp: 0.6, top_p: 0.95, top_k: 20 }
  chat_template: { reasoning_format: deepseek, thinking_toggle: enable_thinking }
  sources:
    - repo: Qwen/Qwen3-0.6B-GGUF
      kind: gguf
      trust: official
      quants:
        - { name: Q8_0 }
  measured:
    # Two runs made to identify the speed estimator's constants rather than to
    # recommend this model. A small dense model is the only way to isolate a pool:
    # the traffic is exactly its block weights, nothing else competes, and running
    # it first entirely in system memory and then entirely on the card separates
    # two efficiencies that four larger measurements together could not.
    - profile: "rtx4060-8gb-ddr5-128gb, everything in system memory"
      quant: Q8_0
      gen_tps: 78.0
      pp_tps: 2924
      context: 128
      flags: "-ngl 0 -t 8"
      llama_cpp_build: 10867
      date: 2026-09-10
      source: docs/calibration/2026-09-09-reference-machine.md
    - profile: "rtx4060-8gb-ddr5-128gb, everything on the card"
      quant: Q8_0
      gen_tps: 279.5
      pp_tps: 21734
      context: 128
      flags: "-ngl 99"
      llama_cpp_build: 10867
      date: 2026-09-10
      source: docs/calibration/2026-09-09-reference-machine.md

- id: qwen3.8-flash-next
  name: Qwen3.8-Flash-Next
  vendor: Alibaba Qwen
  family: qwen3
  release_date: 2026-08-27
  license:
    spdx: qwen-community-1.0
    url: "https://huggingface.co/Qwen/Qwen3.8-Flash-Next/blob/main/LICENSE"
  params: { total_b: 125, active_b: 6, ngram_table_b: 51 }
  architecture:
    class: moe-hybrid
    gguf_arch: qwen4exp
    notes: >-
      48 layers pairing Gated DeltaNet linear attention with Qwen Sparse Attention
      (QSA); 512 routed experts, 10 used per token, 1 shared expert, plus a 51B-entry
      n-gram lookup table and a 4B multi-token-prediction head. Vision input through
      an image/video encoder.
  context: { native: 262144, extended: 1048576, extended_method: yarn }
  capabilities: [coding, thinking, vision, tools, multilingual, long-context]
  # general and chat were missing, and their absence was a curation slip rather than a
  # judgement: this is the vendor's flagship instruction-tuned model, not a specialist.
  # The omission was visible from the outside, because a general request on the reference
  # machine excluded the two strongest models in the catalog and returned the two weakest.
  # A specialist stays a specialist: Qwen3-Coder-Next is coding only and keeps it.
  use_cases: [coding, reasoning, multimodal, general, chat]
  quality:
    baseline: 84
    benchmarks:
      - name: SWE-bench Pro
        score: 62.5
        source: "https://huggingface.co/Qwen/Qwen3.8-Flash-Next"
      - name: LiveCodeBench v6
        score: 91.9
        source: "https://huggingface.co/Qwen/Qwen3.8-Flash-Next"
      - name: GPQA Diamond
        score: 91.7
        source: "https://huggingface.co/Qwen/Qwen3.8-Flash-Next"
      - name: RealWorldQA
        score: 88.5
        source: "https://huggingface.co/Qwen/Qwen3.8-Flash-Next"
  sampling: { temp: 1.0, top_p: 0.95, top_k: 20, min_p: 0.0, presence_penalty: 0.0, repeat_penalty: 1.0 }
  chat_template: { reasoning_format: deepseek, thinking_toggle: enable_thinking }
  llama_cpp:
    kv_types_allowed: [f16]
    # per_layer_token_embd.weight is a 28.8 GB lookup table, a quarter of the download,
    # that llama.cpp streams from disk rather than holding in memory. Naming it here keeps
    # it out of the resident weights and out of the bits-per-weight figure.
    lazy_tensors: [per_layer_token_embd]
  sources:
    - repo: unsloth/Qwen3.8-Flash-Next-GGUF
      kind: gguf
      trust: unsloth
      quants:
        - { name: UD-Q4_K_XL }
      extras:
        # The model declares the vision capability, so the projector has to be declared
        # too: without it nothing charges its bytes to a pool and a plan comes out about
        # 1.9 GB of card too optimistic for anyone who actually wants vision. The MTP
        # draft weights are listed for the same reason, since a plan that turns them on
        # has to know what they cost.
        - { role: mmproj, file: mmproj-F16.gguf }
        - { role: mtp, file: MTP/mtp-Qwen3.8-Flash-Next-shared-Q8_0.gguf }
  measured:
    - profile: "Gen 1K / Prompt 1K, -ub 2048, vision and shared experts on GPU"
      quant: UD-Q4_K_XL
      gen_tps: 14.5
      pp_tps: 50
      context: 16384
      flags: "-ngl 99 --n-cpu-moe 48 --fit off -fa on -t 16 -tb 16 -b 4096 -ub 2048"
      llama_cpp_build: 10867
      date: 2026-09-09
      source: docs/calibration/2026-09-09-reference-machine.md
    - profile: "winning configuration: Gen 1K / Prompt 1K, shared experts and vision on CPU"
      quant: UD-Q4_K_XL
      gen_tps: 13.9
      pp_tps: 49.4
      context: 40960
      # The whole command line, not the delta. The calibration record states the base
      # flags once for every run of this model and then names only what the winning
      # configuration adds; a benchmark that does not say where its layers went describes
      # no placement, and this row was the one the estimator could match to anything.
      flags: >-
        -ngl 99 --n-cpu-moe 48 --fit off -fa on -t 16 -tb 16 -b 4096 -ub 1024
        --no-mmproj-offload -ot ffn_.*_shexp=CPU
      llama_cpp_build: 10867
      peak_vram_gb: 7.3
      date: 2026-09-09
      source: docs/calibration/2026-09-09-reference-machine.md
